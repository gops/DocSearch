[package]
name = "docsearch"
version = "0.2.0"
edition = "2021"
authors = ["Gopal Patel"]
description = "Cross-platform local document indexing & search application with native Slint GUI"
license = "MIT"

[dependencies]
slint = { version = "1.18", features = ["renderer-femtovg"] }
tantivy = "0.27"
notify = "8.2"
walkdir = "2.5"
sha2 = "0.11"
hex = "0.4"
rfd = "0.18"
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
open = "5.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.6", features = ["derive"] }
zip = { version = "9.5", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
crossbeam-channel = "0.5"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3.10"

[build-dependencies]
slint-build = "1.18"
