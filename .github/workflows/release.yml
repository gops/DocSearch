name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libgl1-mesa-dev dpkg-dev apt-utils

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Package Release Assets
        id: package
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          mkdir -p dist

          # 1. Archive tar.gz
          cp target/release/docsearch dist/
          cp LICENSE README.md dist/
          tar -czvf "dist/docsearch_${VERSION}_linux_amd64.tar.gz" -C target/release docsearch

          # 2. Package .deb
          DEB_DIR="deb-staging"
          mkdir -p "$DEB_DIR/DEBIAN"
          mkdir -p "$DEB_DIR/usr/bin"
          mkdir -p "$DEB_DIR/usr/share/applications"
          mkdir -p "$DEB_DIR/usr/share/icons/hicolor/256x256/apps"

          cp target/release/docsearch "$DEB_DIR/usr/bin/docsearch"
          chmod 755 "$DEB_DIR/usr/bin/docsearch"
          cp assets/docsearch.desktop "$DEB_DIR/usr/share/applications/"
          cp assets/docsearch.png "$DEB_DIR/usr/share/icons/hicolor/256x256/apps/"

          echo "Package: docsearch" > "$DEB_DIR/DEBIAN/control"
          echo "Version: $VERSION" >> "$DEB_DIR/DEBIAN/control"
          echo "Section: utils" >> "$DEB_DIR/DEBIAN/control"
          echo "Priority: optional" >> "$DEB_DIR/DEBIAN/control"
          echo "Architecture: amd64" >> "$DEB_DIR/DEBIAN/control"
          echo "Maintainer: DocSearch Contributors <https://github.com/gops/DocSearch>" >> "$DEB_DIR/DEBIAN/control"
          echo "Description: Local cross-platform document search with native Slint GUI and Tantivy" >> "$DEB_DIR/DEBIAN/control"
          echo "Homepage: https://github.com/gops/DocSearch" >> "$DEB_DIR/DEBIAN/control"

          # Add postinst script: auto-register APT repo so manual .deb installs receive apt updates
          echo '#!/bin/sh' > "$DEB_DIR/DEBIAN/postinst"
          echo 'set -e' >> "$DEB_DIR/DEBIAN/postinst"
          echo 'if [ ! -f /etc/apt/sources.list.d/docsearch.list ]; then' >> "$DEB_DIR/DEBIAN/postinst"
          echo '    echo "deb [trusted=yes] https://iam.patelgopal.com/DocSearch/ ./" > /etc/apt/sources.list.d/docsearch.list' >> "$DEB_DIR/DEBIAN/postinst"
          echo 'fi' >> "$DEB_DIR/DEBIAN/postinst"
          echo 'exit 0' >> "$DEB_DIR/DEBIAN/postinst"
          chmod 755 "$DEB_DIR/DEBIAN/postinst"

          # Add postrm script: clean up repo file on purge
          echo '#!/bin/sh' > "$DEB_DIR/DEBIAN/postrm"
          echo 'set -e' >> "$DEB_DIR/DEBIAN/postrm"
          echo 'if [ "$1" = "purge" ]; then' >> "$DEB_DIR/DEBIAN/postrm"
          echo '    rm -f /etc/apt/sources.list.d/docsearch.list' >> "$DEB_DIR/DEBIAN/postrm"
          echo 'fi' >> "$DEB_DIR/DEBIAN/postrm"
          echo 'exit 0' >> "$DEB_DIR/DEBIAN/postrm"
          chmod 755 "$DEB_DIR/DEBIAN/postrm"

          dpkg-deb --build "$DEB_DIR" "dist/docsearch_${VERSION}_linux_amd64.deb"

          # 3. Generate SHA-256 Checksums
          cd dist
          sha256sum docsearch_${VERSION}_linux_amd64.* > checksums.txt
          cd ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/checksums.txt
          name: "DocSearch ${{ github.ref_name }}"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout gh-pages for APT repository
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: apt-repo

      - name: Update APT repository index & deploy to GitHub Pages
        run: |
          # Copy newly built deb packages to apt repo directory
          cp dist/*.deb apt-repo/
          cd apt-repo
          
          # Generate Packages and Packages.gz
          dpkg-scanpackages --multiversion . /dev/null > Packages
          gzip -9c Packages > Packages.gz
          
          # Generate Release file
          rm -f Release Release.tmp
          apt-ftparchive -o APT::FTPArchive::Release::Origin="DocSearch" \
                         -o APT::FTPArchive::Release::Label="DocSearch" \
                         -o APT::FTPArchive::Release::Suite="stable" \
                         -o APT::FTPArchive::Release::Codename="stable" \
                         -o APT::FTPArchive::Release::Architectures="amd64" \
                         -o APT::FTPArchive::Release::Components="main" \
                         -o APT::FTPArchive::Release::Description="DocSearch APT Repository" \
                         release . > Release.tmp
          mv Release.tmp Release
          
          # Git commit and push to gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update APT repository for ${{ github.ref_name }}" || echo "No changes to commit"
          git push origin gh-pages
