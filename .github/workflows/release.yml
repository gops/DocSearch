name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout gh-pages for APT repository
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: apt-repo

      - name: Install APT repository tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils

      - name: Update APT repository index & deploy to GitHub Pages
        run: |
          # Copy newly built deb packages to apt repo directory
          cp dist/*.deb apt-repo/
          cd apt-repo
          
          # Generate Packages and Packages.gz
          dpkg-scanpackages --multiversion . /dev/null > Packages
          gzip -9c Packages > Packages.gz
          
          # Generate Release file
          rm -f Release Release.tmp
          apt-ftparchive -o APT::FTPArchive::Release::Origin="DocSearch" \
                         -o APT::FTPArchive::Release::Label="DocSearch" \
                         -o APT::FTPArchive::Release::Suite="stable" \
                         -o APT::FTPArchive::Release::Codename="stable" \
                         -o APT::FTPArchive::Release::Architectures="amd64 arm64" \
                         -o APT::FTPArchive::Release::Components="main" \
                         -o APT::FTPArchive::Release::Description="DocSearch APT Repository" \
                         release . > Release.tmp
          mv Release.tmp Release
          
          # Git commit and push to gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update APT repository for ${{ github.ref_name }}" || echo "No changes to commit"
          git push origin gh-pages

