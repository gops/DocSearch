# GoReleaser configuration for DocSearch
# Reference: https://goreleaser.com
version: 2

project_name: docsearch

before:
  hooks:
    - go mod tidy

builds:
  - id: docsearch
    main: ./cmd/docsearch
    binary: docsearch
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.Version={{ .Version }}

archives:
  - id: default
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: gops
    name: DocSearch
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## DocSearch {{ .Tag }}
    Welcome to this release of DocSearch.
